nd="url(#a)" marker-start="url(#b)"/><text x="374.0" y="101.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">measurements</text><polyline points="732,110.0 880,110.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="806.0" y="101.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">ICMP ping</text><polyline points="732,134.0 880,262.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="806.0" y="184.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="end">ICMP · UDP · HTTPS</text><polyline points="158.0,172 158.0,224" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="158.0" y="202.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="start">  append</text><polyline points="300,134.0 448,262.0" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="374.0" y="184.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="end">flag file</text><line x1="24" y1="378" x2="1156" y2="378" stroke="#e6e9ee" stroke-width="1"/><text x="24.0" y="404.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Nothing leaves the Mac but test traffic. Deleting the flag file turns Game Mode off: no second prompt.</text></svg>