name: GameReady
options:
  bundleIdPrefix: io.github.caputodavide93
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  GameReadyCore:
    path: Packages/GameReadyCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  GameReady:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: GameReadyCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Game Ready
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleName: Game Ready
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it, es, fr, de, pt-BR, ja, zh-Hans, ko, hi]
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 Davide Caputo. MIT licence."
        NSAppleEventsUsageDescription: "Game Ready reads and, if you turn it on, tunes Better xCloud in your open xbox.com tab."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.caputodavide93.gameready
        PRODUCT_NAME: Game Ready
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/GameReady.entitlements
